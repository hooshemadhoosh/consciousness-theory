<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<title>یادداشت‌های نظریهٔ آگاهی</title>
<script>
  /* GitHub Pages این فایل را برای هر نشانیِ پیدا‌نشده‌ای در همین پروژه
     سرو می‌کند. مسیریابی سایت هش‌محور است (#/ و #/<slug>) و هیچ مسیر
     سروری لازم ندارد؛ پس هر نشانیِ اشتباه فقط باید به ریشهٔ همین پروژه
     برگردد — نخستین بخش مسیر، نام ریپو است (مثلاً consciousness-theory). */
  (function () {
    var seg = location.pathname.split('/').filter(function (s) { return s; })[0] || '';
    location.replace(location.origin + (seg ? '/' + seg : '') + '/');
  })();
</script>
</head>
<body>
<p>در حال بازگشت به <a href="./">صفحهٔ اصلی یادداشت‌ها</a>…</p>
</body>
</html>
